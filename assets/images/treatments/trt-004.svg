<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="curingBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#bg4)" />

  <!-- Tooth Base -->
  <g transform="translate(145, 60)">
    <path d="M35 15 C45 8, 55 8, 65 15 C75 10, 85 10, 95 18 C105 28, 102 45, 98 65 C95 82, 88 105, 80 110 C72 115, 68 95, 65 80 C62 95, 58 115, 50 110 C42 105, 35 82, 32 65 C28 45, 25 28, 35 15 Z" 
          fill="#f8fafc" stroke="#e2e8f0" stroke-width="2.5" />
    
    <!-- Restored Composite Occlusal Cavity -->
    <path d="M50 22 C60 16, 75 17, 82 23 C85 32, 75 42, 65 42 C52 42, 46 32, 50 22 Z" 
          fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
    <!-- Natural tooth contour lines -->
    <path d="M42 35 C48 55, 60 55, 65 70" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M88 35 C82 55, 70 55, 65 70" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- LED Dental Curing Light Wand -->
  <g transform="translate(85, 30)">
    <!-- Light Handpiece -->
    <path d="M10 20 L75 40 L85 45 L15 30 Z" fill="#475569" stroke="#64748b" stroke-width="1.5" />
    <!-- Curing Tip -->
    <path d="M75 40 Q95 48, 115 65" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="115" cy="65" r="5" fill="#3b82f6" />
    <!-- Blue Photopolymerization Light Beam -->
    <polygon points="115,65 195,85 175,105" fill="url(#curingBeam)" />
  </g>

  <!-- Glow and Sparkle -->
  <g transform="translate(265, 80)">
    <path d="M0 -7 L1.5 -1.5 L7 0 L1.5 1.5 L0 7 L-1.5 1.5 L-7 0 L-1.5 -1.5 Z" fill="#facc15" />
  </g>

  <g transform="translate(24, 24)">
    <rect width="115" height="24" rx="6" fill="#1e293b" stroke="#334155" />
    <circle cx="14" cy="12" r="4" fill="#eab308" />
    <text x="24" y="16" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="1">RESTORATIVE</text>
  </g>
</svg>
