<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="mirrorGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" rx="16" fill="url(#bg1)" />
  <circle cx="200" cy="120" r="90" fill="url(#glow1)" />

  <!-- Grid Accents -->
  <path d="M40 40 L360 40 M40 200 L360 200" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" />

  <!-- Central Tooth Motif -->
  <g transform="translate(130, 60)">
    <!-- Stylized Molar -->
    <path d="M35 15 C45 8, 55 8, 65 15 C75 10, 85 10, 95 18 C105 28, 102 45, 98 65 C95 82, 88 105, 80 110 C72 115, 68 95, 65 80 C62 95, 58 115, 50 110 C42 105, 35 82, 32 65 C28 45, 25 28, 35 15 Z" 
          fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
    <!-- Tooth Cusp Highlight -->
    <path d="M45 25 C55 20, 75 20, 85 25" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M65 25 L65 50" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Diagnostic Dental Mirror -->
  <g transform="translate(80, 50)">
    <!-- Mirror Handle -->
    <line x1="20" y1="150" x2="110" y2="70" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="20" y1="150" x2="110" y2="70" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <!-- Mirror Rim -->
    <circle cx="125" cy="55" r="28" fill="#1e293b" stroke="#f8fafc" stroke-width="4" />
    <!-- Mirror Glass Reflecting Light -->
    <circle cx="125" cy="55" r="22" fill="url(#mirrorGlass)" opacity="0.85" />
    <ellipse cx="121" cy="50" rx="14" ry="7" transform="rotate(-30 121 50)" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Dental Explorer / Probe -->
  <g transform="translate(240, 50)">
    <path d="M-20 60 Q-10 40, 10 50 L90 140" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M-20 60 Q-15 50, -5 55" stroke="#38bdf8" stroke-width="2" fill="none" />
  </g>

  <!-- Badge / Clinical Tag -->
  <g transform="translate(24, 24)">
    <rect width="110" height="24" rx="6" fill="#1e293b" stroke="#334155" />
    <circle cx="14" cy="12" r="4" fill="#38bdf8" />
    <text x="24" y="16" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="1">PREVENTIVE</text>
  </g>
</svg>
