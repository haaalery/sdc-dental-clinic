<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="waterGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#bg2)" />
  <circle cx="200" cy="120" r="95" fill="url(#waterGlow)" />

  <!-- Tooth Base -->
  <g transform="translate(145, 55)">
    <path d="M35 15 C45 8, 55 8, 65 15 C75 10, 85 10, 95 18 C105 28, 102 45, 98 65 C95 82, 88 105, 80 110 C72 115, 68 95, 65 80 C62 95, 58 115, 50 110 C42 105, 35 82, 32 65 C28 45, 25 28, 35 15 Z" 
          fill="#f8fafc" stroke="#e2e8f0" stroke-width="2.5" />
    <!-- Clean Gleam -->
    <path d="M40 30 Q55 22, 70 30" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>

  <!-- Ultrasonic Scaler Handpiece -->
  <g transform="translate(60, 45)">
    <!-- Scaler Body -->
    <path d="M10 160 L100 85 L115 90 L25 165 Z" fill="#334155" stroke="#475569" stroke-width="2" />
    <path d="M100 85 L135 60 L140 64 L115 90 Z" fill="#94a3b8" />
    <!-- Fine Curved Metal Tip -->
    <path d="M135 60 Q155 45, 170 65" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Scaler tip water micro-spray droplets -->
    <circle cx="178" cy="62" r="3" fill="#38bdf8" />
    <circle cx="185" cy="55" r="2" fill="#06b6d4" />
    <circle cx="175" cy="50" r="1.5" fill="#e0f2fe" />
    <circle cx="190" cy="65" r="2.5" fill="#38bdf8" opacity="0.7" />
    <circle cx="182" cy="72" r="1.5" fill="#06b6d4" opacity="0.6" />
  </g>

  <!-- Sparkles -->
  <g transform="translate(260, 65)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#38bdf8" />
  </g>
  <g transform="translate(230, 150)">
    <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z" fill="#06b6d4" />
  </g>

  <g transform="translate(24, 24)">
    <rect width="110" height="24" rx="6" fill="#1e293b" stroke="#334155" />
    <circle cx="14" cy="12" r="4" fill="#06b6d4" />
    <text x="24" y="16" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="1">PREVENTIVE</text>
  </g>
</svg>
