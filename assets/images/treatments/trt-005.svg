<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#bg5)" />

  <!-- Background Surgical Shield -->
  <circle cx="200" cy="120" r="85" fill="#334155" opacity="0.3" />

  <!-- Single Tooth Raised (Extracted) -->
  <g transform="translate(150, 75)">
    <!-- Premolar / Molar Tooth -->
    <path d="M30 15 C40 8, 50 8, 60 15 C70 12, 78 15, 82 25 C88 38, 85 55, 80 75 C75 95, 68 115, 62 120 C58 122, 55 105, 52 90 C50 105, 45 122, 40 120 C34 115, 28 95, 25 75 C20 55, 18 38, 22 25 C24 15, 26 12, 30 15 Z" 
          fill="#f8fafc" stroke="#e2e8f0" stroke-width="2.5" />
    <path d="M45 25 Q52 18, 62 25" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Surgical Forceps Beaks -->
  <g transform="translate(115, 45)">
    <!-- Left Forceps Beak -->
    <path d="M15 15 C25 35, 45 60, 50 75 C45 80, 40 70, 20 40 L5 25 Z" fill="url(#metal)" />
    <!-- Right Forceps Beak -->
    <path d="M125 15 C115 35, 95 60, 90 75 C95 80, 100 70, 120 40 L135 25 Z" fill="url(#metal)" />
    <!-- Forceps Joint -->
    <circle cx="70" cy="18" r="9" fill="#64748b" stroke="#cbd5e1" stroke-width="2" />
  </g>

  <!-- Safe Care Gentle Indicator Cross -->
  <g transform="translate(260, 50)">
    <circle cx="16" cy="16" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M16 10 L16 22 M10 16 L22 16" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <g transform="translate(24, 24)">
    <rect width="115" height="24" rx="6" fill="#1e293b" stroke="#334155" />
    <circle cx="14" cy="12" r="4" fill="#a855f7" />
    <text x="24" y="16" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="1">ORAL SURGERY</text>
  </g>
</svg>
