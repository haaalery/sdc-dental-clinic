<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#bg3)" />

  <!-- Periodontal Gum Tissue Background Shape -->
  <path d="M60 130 Q130 110, 200 135 Q270 110, 340 130 L340 210 L60 210 Z" fill="url(#gumGrad)" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Two Molars Sitting in Gumline -->
  <g transform="translate(110, 60)">
    <path d="M25 15 C35 8, 45 8, 55 15 C65 10, 75 10, 85 18 C92 28, 90 50, 86 70 C83 85, 78 115, 70 120 C64 125, 60 105, 57 90 C54 105, 50 125, 44 120 C38 115, 32 85, 29 70 C25 50, 22 28, 25 15 Z" 
          fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  </g>
  <g transform="translate(195, 60)">
    <path d="M25 15 C35 8, 45 8, 55 15 C65 10, 75 10, 85 18 C92 28, 90 50, 86 70 C83 85, 78 115, 70 120 C64 125, 60 105, 57 90 C54 105, 50 125, 44 120 C38 115, 32 85, 29 70 C25 50, 22 28, 25 15 Z" 
          fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  </g>

  <!-- Periodontal Curette Instrument (Grace Curette) -->
  <g transform="translate(140, 50)">
    <line x1="160" y1="20" x2="80" y2="100" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
    <!-- Curette Angular Working End -->
    <path d="M80 100 L65 115 Q55 125, 48 118" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <circle cx="48" cy="118" r="3" fill="#38bdf8" />
  </g>

  <!-- Clean Subgingival Indicator Ring -->
  <circle cx="178" cy="140" r="14" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="2 4" fill="none" />

  <g transform="translate(24, 24)">
    <rect width="115" height="24" rx="6" fill="#1e293b" stroke="#334155" />
    <circle cx="14" cy="12" r="4" fill="#f43f5e" />
    <text x="24" y="16" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="1">PERIODONTICS</text>
  </g>
</svg>
