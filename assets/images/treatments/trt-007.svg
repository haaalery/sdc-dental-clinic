<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="canalGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#bg7)" />

  <!-- Single Anterior Incisor Tooth in Cutaway Profile -->
  <g transform="translate(160, 45)">
    <!-- Enamel & Dentin Outer Wall -->
    <path d="M40 10 C30 25, 20 60, 24 95 C28 125, 38 150, 40 160 C42 150, 52 125, 56 95 C60 60, 50 25, 40 10 Z" 
          fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5" />
    <!-- Crown Incisal Edge -->
    <path d="M30 20 L50 20" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- Root Canal Chamber (Sealed & Cleaned) -->
    <path d="M40 35 C36 45, 34 85, 37 115 C39 135, 40 150, 40 155 C40 150, 41 135, 43 115 C46 85, 44 45, 40 35 Z" 
          fill="url(#canalGlow)" />
  </g>

  <!-- Endodontic Hand File (K-File) with Calibration Rings -->
  <g transform="translate(145, 25)">
    <!-- File Handle (Blue) -->
    <rect x="50" y="5" width="12" height="30" rx="3" fill="#3b82f6" stroke="#60a5fa" stroke-width="1.5" />
    <!-- File Shaft -->
    <line x1="56" y1="35" x2="56" y2="150" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
    <!-- Serrated / Spiraled File Working Tip -->
    <path d="M54 75 L58 78 M54 85 L58 88 M54 95 L58 98 M54 105 L58 108 M54 115 L58 118" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Healing / Sealed Cross Badge -->
  <g transform="translate(255, 65)">
    <circle cx="16" cy="16" r="16" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <path d="M10 16 L14 20 L22 12" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <g transform="translate(24, 24)">
    <rect width="115" height="24" rx="6" fill="#1e293b" stroke="#334155" />
    <circle cx="14" cy="12" r="4" fill="#f97316" />
    <text x="24" y="16" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="1">ENDODONTICS</text>
  </g>
</svg>
